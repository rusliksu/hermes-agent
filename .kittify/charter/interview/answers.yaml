mission: "software-dev"
profile: "comprehensive"
answers:
  project_intent: "Hermes is a personal AI agent that keeps the core narrow while exposing capability through gateways, plugins, skills, CLI, TUI, desktop, and scheduled jobs. This project charter is a minimal runtime summary of the existing AGENTS.md contribution rules for the Telegram polling observability planning mission."
  languages_frameworks: "Python gateway/runtime code with pytest tests; TypeScript/React areas exist but are not in scope for this Telegram gateway/status planning baseline."
  testing_requirements: "Use behavior-contract pytest coverage for affected Python gateway/status code. For status readouts and polling progress, assert relationships and invariants rather than snapshot counts or incidental timestamps."
  quality_gates: "Before implementation approval, verify the affected source paths and existing status/API projections by source inspection. After implementation, run focused behavioral tests for Telegram polling progress, network reconnect behavior, runtime status persistence, API server health, dashboard /api/status, and error redaction before review or accept. Preserve prompt caching, message alternation, and existing extension boundaries."
  review_policy: "Changes must be reviewable in small work packages, keep implementation additive and backward-compatible, and land only through the mission coordination or task branch. Do not commit directly to protected main."
  performance_targets: "Do not add blocking network calls or polling delays to status readers. Runtime status writes must remain best-effort and lightweight enough to run on every valid polling progress observation without disrupting Telegram polling."
  deployment_constraints: "No live gateway restart, deployment, PR, push, merge, cleanup, or secret handling is authorized for this planning baseline. Implementation must not require new endpoint, config schema migration, or live Telegram traffic."
  documentation_policy: "Product-facing documentation duty must be identified when a user-visible status field is introduced or exposed through existing status surfaces."
  risk_boundaries: "Persist only a privacy-safe UTC timestamp for successful current-generation dedicated Telegram getUpdates HTTP/API results. Do not persist payloads, Telegram IDs, bot tokens, URLs, query strings, retry errors, timeout details, or stale-generation observations."
  amendment_process: "Update this charter only when the user explicitly authorizes governance changes. Routine mission planning decisions should be documented in spec, plan, or work packages instead of expanding governance."
  exception_policy: "If a requested implementation would require live operations, secrets, new endpoints, new config schema, or main-branch commits, stop and surface the blocker before implementation."
